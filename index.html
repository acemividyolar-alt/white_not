<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notlarım</title>
<style>
  :root {
    --bg: #f4f1ea;
    --paper: #fffdf7;
    --ink: #2b2724;
    --muted: #8a8378;
    --accent: #c2410c;
    --accent-soft: #f5e6dd;
    --line: #e4ddd0;
    --green: #4d7c4d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
  }
  .app { display: flex; height: 100vh; height: 100dvh; }

  /* ---------- SIDEBAR (desktop) ---------- */
  .sidebar {
    width: 250px;
    flex-shrink: 0;
    background: #efe9de;
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: 1.2rem 0;
  }
  .sidebar h1 { font-size: 1.5rem; padding: 0 1.2rem 1rem; letter-spacing: -0.02em; }
  .proj-list { flex: 1; overflow-y: auto; padding: 0 0.6rem; }
  .proj {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.6rem 0.7rem; border-radius: 6px; cursor: pointer;
    margin-bottom: 3px; font-size: 1rem;
  }
  .proj:hover { background: #e6dfd2; }
  .proj.active { background: var(--accent); color: #fff; }
  .proj.active .proj-count { color: #ffe; }
  .proj-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj-right { display: flex; align-items: center; gap: 0.4rem; flex-shrink: 0; }
  .proj-count { font-size: 0.75rem; color: var(--muted); font-family: monospace; }
  .proj-x { font-size: 1rem; opacity: 0; padding: 0 0.2rem; }
  .proj:hover .proj-x { opacity: 0.55; }
  .proj-x:active, .proj-x:hover { opacity: 1; }
  .add-proj { margin: 0.8rem 1.2rem 0; display: flex; gap: 0.4rem; }
  .add-proj input {
    flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--paper);
    border-radius: 5px; padding: 0.5rem 0.6rem; font-family: inherit; font-size: 0.95rem; outline: none;
  }
  .add-proj button {
    background: var(--ink); color: #fff; border: none; border-radius: 5px;
    width: 40px; flex-shrink: 0; cursor: pointer; font-size: 1.2rem;
  }

  /* ---------- MAIN ---------- */
  .main { flex: 1; min-width: 0; overflow-y: auto; padding: 1.4rem 2.5rem; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 2px solid var(--ink); padding-bottom: 0.7rem; margin-bottom: 0.9rem; gap: 0.8rem;
  }
  .topbar-left { display: flex; align-items: center; gap: 0.7rem; min-width: 0; }
  .menu-btn {
    display: none; background: transparent; border: none; cursor: pointer;
    font-size: 1.5rem; color: var(--ink); flex-shrink: 0; padding: 0.2rem;
  }
  .topbar h2 { font-size: 1.7rem; letter-spacing: -0.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .export-btn {
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    border-radius: 5px; padding: 0.4rem 0.8rem; font-family: inherit; font-size: 0.82rem;
    cursor: pointer; flex-shrink: 0; white-space: nowrap;
  }
  .export-btn:hover { color: var(--ink); border-color: var(--muted); }

  /* export dropdown */
  .export-wrap { position: relative; flex-shrink: 0; }
  .menu {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 20;
    background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.14); min-width: 220px; overflow: hidden;
    display: none;
  }
  .menu.open { display: block; }
  .menu-group-label {
    font-size: 0.7rem; color: var(--muted); font-family: monospace; text-transform: uppercase;
    letter-spacing: 0.05em; padding: 0.6rem 0.9rem 0.3rem;
  }
  .menu button {
    display: block; width: 100%; text-align: left; background: transparent; border: none;
    font-family: inherit; font-size: 0.92rem; color: var(--ink); padding: 0.55rem 0.9rem; cursor: pointer;
  }
  .menu button:hover { background: var(--accent-soft); }
  .menu .sep { height: 1px; background: var(--line); margin: 0.3rem 0; }

  .progress-wrap { margin-bottom: 1.2rem; }
  .progress-bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--green); transition: width 0.3s; }
  .progress-label { font-size: 0.78rem; color: var(--muted); font-family: monospace; margin-top: 0.3rem; }

  .search {
    width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 6px;
    padding: 0.65rem 0.85rem; font-family: inherit; font-size: 1rem; outline: none; margin-bottom: 1.2rem;
  }
  .search:focus { border-color: var(--accent); }

  .max { max-width: 860px; margin: 0 auto; width: 100%; }

  .composer {
    background: var(--paper); border: 1px solid var(--line); border-radius: 6px;
    padding: 1rem; margin-bottom: 1.8rem; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .composer input, .composer textarea {
    width: 100%; border: none; background: transparent; font-family: inherit;
    color: var(--ink); outline: none; resize: none;
  }
  .composer .c-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 0.4rem; }
  .composer textarea { font-size: 1rem; line-height: 1.6; min-height: 60px; }
  .composer .c-tags { font-size: 0.9rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 0.6rem; margin-top: 0.5rem; }
  .composer input::placeholder, .composer textarea::placeholder { color: var(--muted); }
  .c-row { display: flex; justify-content: space-between; align-items: center; gap: 0.6rem; margin-top: 0.7rem; }
  .type-toggle { display: flex; gap: 0.3rem; }
  .type-toggle button {
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    border-radius: 5px; padding: 0.35rem 0.8rem; font-family: inherit; font-size: 0.85rem; cursor: pointer;
  }
  .type-toggle button.sel { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn-add {
    background: var(--accent); color: #fff; border: none; border-radius: 5px;
    padding: 0.5rem 1.4rem; font-family: inherit; font-size: 0.92rem; cursor: pointer;
  }
  .btn-add:active { opacity: 0.85; }

  .item {
    background: var(--paper); border: 1px solid var(--line); border-radius: 6px;
    padding: 0.9rem 1.1rem; margin-bottom: 0.9rem; box-shadow: 0 1px 4px rgba(0,0,0,0.03);
  }
  .item.pinned { border-left: 3px solid var(--accent); }
  .item.task { display: flex; align-items: flex-start; gap: 0.7rem; }
  .task-check { width: 22px; height: 22px; flex-shrink: 0; margin-top: 2px; cursor: pointer; accent-color: var(--green); }
  .task-body { flex: 1; min-width: 0; }
  .item.done .task-text { text-decoration: line-through; color: var(--muted); }
  .item h3 { font-size: 1.15rem; margin-bottom: 0.3rem; word-break: break-word; }
  .item p { font-size: 0.97rem; line-height: 1.6; white-space: pre-wrap; color: #443e38; word-break: break-word; }
  .task-text { font-size: 1rem; word-break: break-word; }
  .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.6rem; }
  .tag { background: var(--accent-soft); color: var(--accent); font-size: 0.75rem; padding: 0.15rem 0.6rem; border-radius: 10px; font-family: monospace; }
  .meta { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-top: 0.7rem; padding-top: 0.55rem; border-top: 1px solid var(--line); }
  .date { font-size: 0.74rem; color: var(--muted); font-family: monospace; }
  .actions { display: flex; gap: 0.3rem; flex-shrink: 0; }
  .actions button { background: transparent; border: none; color: var(--muted); font-size: 0.82rem; cursor: pointer; font-family: inherit; padding: 0.2rem 0.4rem; }
  .actions button:active, .actions button:hover { color: var(--accent); }

  .empty { text-align: center; color: var(--muted); padding: 2.5rem 0; font-style: italic; }
  .status { font-size: 0.76rem; color: var(--muted); text-align: center; margin: 1rem 0; font-family: monospace; }

  /* wide-screen two-column layout */
  .content { width: 100%; }
  @media (min-width: 1100px) {
    .max { max-width: 1100px; }
    .content {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 2rem;
      align-items: start;
    }
    .col-composer { position: sticky; top: 0; }
    .composer { margin-bottom: 0; }
    .col-list { min-width: 0; }
  }

  /* overlay for mobile drawer */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 5; }

  /* ---------- MOBILE ---------- */
  @media (max-width: 720px) {
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 10;
      width: 78%; max-width: 300px;
      transform: translateX(-100%); transition: transform 0.25s ease;
      box-shadow: 2px 0 18px rgba(0,0,0,0.18);
    }
    .app.drawer-open .sidebar { transform: translateX(0); }
    .app.drawer-open .overlay { display: block; }
    .menu-btn { display: block; }
    .main { padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom)); }
    .topbar h2 { font-size: 1.4rem; }
    .max { max-width: 100%; }
    .c-row { flex-wrap: wrap; }
    .btn-add { flex: 1; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar">
    <h1>Notlarım</h1>
    <div class="proj-list" id="projList"></div>
    <div class="add-proj">
      <input id="newProj" type="text" placeholder="Yeni proje" maxlength="40">
      <button id="addProj">+</button>
    </div>
  </aside>

  <main class="main">
    <div class="max">
      <div class="topbar">
        <div class="topbar-left">
          <button class="menu-btn" id="menuBtn" aria-label="Projeler">&#9776;</button>
          <h2 id="projTitle">&mdash;</h2>
        </div>
        <div class="export-wrap">
          <button class="export-btn" id="export">Dışa / İçe aktar ▾</button>
          <div class="menu" id="exportMenu">
            <div class="menu-group-label">Açık proje</div>
            <button data-act="proj-md">Markdown (.md)</button>
            <button data-act="proj-txt">Düz metin (.txt)</button>
            <button data-act="proj-pdf">PDF olarak yazdır</button>
            <div class="sep"></div>
            <div class="menu-group-label">Tüm projeler</div>
            <button data-act="all-md">Markdown (.md)</button>
            <button data-act="all-txt">Düz metin (.txt)</button>
            <button data-act="all-pdf">PDF olarak yazdır</button>
            <div class="sep"></div>
            <div class="menu-group-label">Yedek</div>
            <button data-act="json-export">JSON yedeği indir</button>
            <button data-act="json-import">JSON yedeği yükle…</button>
          </div>
          <input type="file" id="importFile" accept="application/json,.json" style="display:none">
        </div>
      </div>

      <div class="progress-wrap" id="progressWrap" style="display:none">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-label" id="progressLabel"></div>
      </div>

      <input class="search" id="search" type="text" placeholder="Ara (başlık, içerik, #etiket)...">

      <div class="content">
        <div class="col-composer">
          <div class="composer">
            <input class="c-title" id="cTitle" type="text" placeholder="Başlık" maxlength="120">
            <textarea id="cBody" placeholder="İçerik..."></textarea>
            <input class="c-tags" id="cTags" type="text" placeholder="Etiketler (virgülle): tasarım, acil">
            <div class="c-row">
              <div class="type-toggle">
                <button data-type="note" class="sel" id="tNote">Not</button>
                <button data-type="task" id="tTask">Görev</button>
              </div>
              <button class="btn-add" id="add">Ekle</button>
            </div>
          </div>
        </div>

        <div class="col-list">
          <div id="list"></div>
          <div class="status" id="status"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  let projects = [];
  let items = [];
  let activeProject = null;
  let composerType = 'note';
  let storageOK = true;

  const el = id => document.getElementById(id);

  // ---- Storage wrappers (fail-safe) ----
  async function sGet(k){ try { return await window.storage.get(k); } catch(e){ return null; } }
  async function sSet(k,v){ try { const r = await window.storage.set(k,v); return !!r; } catch(e){ storageOK=false; return false; } }
  async function sDel(k){ try { await window.storage.delete(k); } catch(e){} }
  async function sList(p){ try { const r = await window.storage.list(p); return (r && r.keys) ? r.keys : []; } catch(e){ return null; } }

  async function loadAll() {
    let okStorage = true;

    if (typeof window.storage === 'undefined') { okStorage = false; }

    if (okStorage) {
      const pkeys = await sList('proj:');
      if (pkeys === null) { okStorage = false; }
      else {
        const plist = [];
        for (const k of pkeys) { const it = await sGet(k); if (it && it.value) { try { plist.push(JSON.parse(it.value)); } catch(e){} } }
        projects = plist.sort((a,b) => a.created - b.created);

        const ikeys = await sList('item:') || [];
        const ilist = [];
        for (const k of ikeys) { const it = await sGet(k); if (it && it.value) { try { ilist.push(JSON.parse(it.value)); } catch(e){} } }
        items = ilist;
      }
    }

    storageOK = okStorage;
    if (!storageOK) {
      el('status').textContent = 'Kalıcı depolama kullanılamıyor — değişiklikler bu oturumda tutulur.';
    }

    if (projects.length === 0) {
      const p = { id: uid(), name: 'Genel', created: Date.now() };
      projects.push(p);
      activeProject = p.id;
      if (storageOK) await sSet('proj:' + p.id, JSON.stringify(p));
    } else {
      activeProject = projects[0].id;
    }
    renderProjects();
    renderMain();
  }

  async function saveProject(p) { if (storageOK) await sSet('proj:' + p.id, JSON.stringify(p)); }
  async function saveItem(i) { if (storageOK) await sSet('item:' + i.id, JSON.stringify(i)); }
  async function deleteItemStore(id) { if (storageOK) await sDel('item:' + id); }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

  async function createProject(name) {
    const p = { id: uid(), name: name, created: Date.now() };
    projects.push(p);
    activeProject = p.id;
    await saveProject(p);
    renderProjects();
    renderMain();
    return p;
  }

  async function deleteProject(id) {
    const p = projects.find(x => x.id === id);
    const cnt = items.filter(i => i.projectId === id).length;
    if (!confirm('"' + p.name + '" projesi ve içindeki ' + cnt + ' öğe silinsin mi?')) return;
    for (const i of items.filter(x => x.projectId === id)) { await deleteItemStore(i.id); }
    items = items.filter(i => i.projectId !== id);
    await sDel('proj:' + id);
    projects = projects.filter(x => x.id !== id);
    if (projects.length === 0) { await createProject('Genel'); return; }
    if (activeProject === id) activeProject = projects[0].id;
    renderProjects();
    renderMain();
  }

  function renderProjects() {
    el('projList').innerHTML = projects.map(p => {
      const cnt = items.filter(i => i.projectId === p.id).length;
      return '<div class="proj ' + (p.id===activeProject?'active':'') + '" data-id="' + p.id + '">' +
        '<span class="proj-name">' + esc(p.name) + '</span>' +
        '<span class="proj-right"><span class="proj-count">' + cnt + '</span>' +
        '<span class="proj-x" data-del="' + p.id + '">✕</span></span></div>';
    }).join('');
    el('projList').querySelectorAll('.proj').forEach(d => {
      d.addEventListener('click', e => {
        if (e.target.dataset.del) { deleteProject(e.target.dataset.del); return; }
        activeProject = d.dataset.id;
        el('search').value = '';
        closeDrawer();
        renderProjects(); renderMain();
      });
    });
  }

  async function addItem() {
    const title = el('cTitle').value.trim();
    const body = el('cBody').value.trim();
    const tags = el('cTags').value.split(',').map(t => t.trim()).filter(Boolean);
    if (!title && !body) return;
    const item = {
      id: uid(), projectId: activeProject, type: composerType,
      title: title || (composerType==='task' ? '' : 'Başlıksız'),
      body: body, tags: tags, done: false, pinned: false, created: Date.now()
    };
    items.push(item);
    await saveItem(item);
    el('cTitle').value = ''; el('cBody').value = ''; el('cTags').value = '';
    renderProjects(); renderMain();
    el('cTitle').focus();
  }

  async function toggleDone(id) { const i = items.find(x => x.id === id); i.done = !i.done; await saveItem(i); renderMain(); }
  async function togglePin(id) { const i = items.find(x => x.id === id); i.pinned = !i.pinned; await saveItem(i); renderMain(); }
  async function removeItem(id) { await deleteItemStore(id); items = items.filter(i => i.id !== id); renderProjects(); renderMain(); }

  function renderMain() {
    const p = projects.find(x => x.id === activeProject);
    el('projTitle').textContent = p ? p.name : '—';

    let mine = items.filter(i => i.projectId === activeProject);

    const tasks = mine.filter(i => i.type === 'task');
    if (tasks.length > 0) {
      const done = tasks.filter(t => t.done).length;
      const pct = Math.round(done / tasks.length * 100);
      el('progressWrap').style.display = 'block';
      el('progressFill').style.width = pct + '%';
      el('progressLabel').textContent = done + '/' + tasks.length + ' görev tamamlandı · %' + pct;
    } else {
      el('progressWrap').style.display = 'none';
    }

    const q = el('search').value.trim().toLowerCase();
    if (q) {
      mine = mine.filter(i => {
        const hay = (i.title + ' ' + i.body + ' ' + i.tags.map(t=>'#'+t).join(' ')).toLowerCase();
        return hay.includes(q.replace(/^#/, ''));
      });
    }

    mine.sort((a,b) => (b.pinned - a.pinned) || (b.created - a.created));

    if (mine.length === 0) {
      el('list').innerHTML = '<div class="empty">' + (q ? 'Eşleşen öğe yok.' : 'Bu projede henüz öğe yok.') + '</div>';
      return;
    }

    el('list').innerHTML = mine.map(i => i.type === 'task' ? taskHTML(i) : noteHTML(i)).join('');
    bindItemEvents();
  }

  function tagsHTML(tags) {
    if (!tags.length) return '';
    return '<div class="tags">' + tags.map(t => '<span class="tag">#' + esc(t) + '</span>').join('') + '</div>';
  }

  function noteHTML(i) {
    return '<div class="item ' + (i.pinned?'pinned':'') + '">' +
      '<h3>' + esc(i.title) + '</h3>' +
      (i.body ? '<p>' + esc(i.body) + '</p>' : '') +
      tagsHTML(i.tags) +
      '<div class="meta"><span class="date">' + fmtDate(i.created) + '</span>' +
      '<div class="actions">' +
      '<button data-pin="' + i.id + '">' + (i.pinned?'Sabit ✓':'Sabitle') + '</button>' +
      '<button data-del="' + i.id + '">Sil</button></div></div></div>';
  }

  function taskHTML(i) {
    return '<div class="item task ' + (i.pinned?'pinned':'') + ' ' + (i.done?'done':'') + '">' +
      '<input type="checkbox" class="task-check" data-check="' + i.id + '" ' + (i.done?'checked':'') + '>' +
      '<div class="task-body">' +
      '<div class="task-text">' + esc(i.title || i.body) + '</div>' +
      (i.title && i.body ? '<p>' + esc(i.body) + '</p>' : '') +
      tagsHTML(i.tags) +
      '<div class="meta"><span class="date">' + fmtDate(i.created) + '</span>' +
      '<div class="actions">' +
      '<button data-pin="' + i.id + '">' + (i.pinned?'Sabit ✓':'Sabitle') + '</button>' +
      '<button data-del="' + i.id + '">Sil</button></div></div></div></div>';
  }

  function bindItemEvents() {
    el('list').querySelectorAll('[data-check]').forEach(c => c.addEventListener('change', () => toggleDone(c.dataset.check)));
    el('list').querySelectorAll('[data-pin]').forEach(b => b.addEventListener('click', () => togglePin(b.dataset.pin)));
    el('list').querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => removeItem(b.dataset.del)));
  }

  // ---- Export / Import ----
  function projectsToExport(scope) {
    return scope === 'all' ? projects : projects.filter(p => p.id === activeProject);
  }

  function buildMarkdown(scope) {
    let out = '';
    projectsToExport(scope).forEach((p, idx) => {
      if (idx > 0) out += '\n\n---\n\n';
      const mine = items.filter(i => i.projectId === p.id).sort((a,b)=>a.created-b.created);
      out += '# ' + p.name + '\n\n';
      const notes = mine.filter(i => i.type==='note');
      const tasks = mine.filter(i => i.type==='task');
      if (tasks.length) {
        out += '## Görevler\n';
        tasks.forEach(t => { out += '- [' + (t.done?'x':' ') + '] ' + (t.title || t.body) + (t.tags.length?' ('+t.tags.map(x=>'#'+x).join(' ')+')':'') + '\n'; });
        out += '\n';
      }
      if (notes.length) {
        out += '## Notlar\n';
        notes.forEach(n => { out += '\n### ' + n.title + '\n' + n.body + '\n' + (n.tags.length?n.tags.map(x=>'#'+x).join(' ')+'\n':''); });
      }
      if (!mine.length) out += '_Boş._\n';
    });
    return out;
  }

  function buildPlainText(scope) {
    let out = '';
    projectsToExport(scope).forEach((p, idx) => {
      if (idx > 0) out += '\n========================================\n\n';
      const mine = items.filter(i => i.projectId === p.id).sort((a,b)=>a.created-b.created);
      out += p.name.toUpperCase() + '\n' + '-'.repeat(p.name.length) + '\n\n';
      const tasks = mine.filter(i => i.type==='task');
      const notes = mine.filter(i => i.type==='note');
      if (tasks.length) {
        out += 'GÖREVLER\n';
        tasks.forEach(t => { out += '  [' + (t.done?'X':' ') + '] ' + (t.title || t.body) + (t.tags.length?'  ('+t.tags.join(', ')+')':'') + '\n'; });
        out += '\n';
      }
      if (notes.length) {
        out += 'NOTLAR\n';
        notes.forEach(n => { out += '\n  ' + n.title + '\n' + (n.body?'  '+n.body.replace(/\n/g,'\n  ')+'\n':'') + (n.tags.length?'  Etiketler: '+n.tags.join(', ')+'\n':''); });
      }
      if (!mine.length) out += '(Boş)\n';
    });
    return out;
  }

  function download(content, filename, mime) {
    const blob = new Blob([content], {type: mime});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function safeName(scope) {
    if (scope === 'all') return 'tum-notlar';
    const p = projects.find(x => x.id === activeProject);
    return (p.name.replace(/[^\w ğüşıöçĞÜŞİÖÇ-]/g,'').trim() || 'proje');
  }

  function exportMarkdown(scope){ download(buildMarkdown(scope), safeName(scope)+'.md', 'text/markdown'); }
  function exportText(scope){ download(buildPlainText(scope), safeName(scope)+'.txt', 'text/plain'); }

  function exportPDF(scope) {
    const html = '<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><title>' + esc(safeName(scope)) + '</title>' +
      '<style>body{font-family:Georgia,serif;color:#2b2724;max-width:760px;margin:2rem auto;padding:0 1.5rem;line-height:1.6;}' +
      'h1{border-bottom:2px solid #2b2724;padding-bottom:.3rem;margin-top:2rem;}h2{color:#8a8378;font-size:1.05rem;text-transform:uppercase;letter-spacing:.05em;margin-top:1.4rem;}' +
      'h3{margin:1rem 0 .2rem;}.task{margin:.2rem 0;}.done{text-decoration:line-through;color:#8a8378;}' +
      '.tag{background:#f5e6dd;color:#c2410c;font-size:.75rem;padding:.1rem .5rem;border-radius:10px;font-family:monospace;margin-right:.3rem;}' +
      '.date{font-size:.75rem;color:#8a8378;}@media print{body{margin:0;}}</style></head><body>';
    let b = html;
    projectsToExport(scope).forEach(p => {
      const mine = items.filter(i => i.projectId === p.id).sort((a,b)=>a.created-b.created);
      b += '<h1>' + esc(p.name) + '</h1>';
      const tasks = mine.filter(i=>i.type==='task');
      const notes = mine.filter(i=>i.type==='note');
      if (tasks.length){
        b += '<h2>Görevler</h2>';
        tasks.forEach(t => { b += '<div class="task ' + (t.done?'done':'') + '">' + (t.done?'☑':'☐') + ' ' + esc(t.title||t.body) + ' ' + t.tags.map(x=>'<span class="tag">#'+esc(x)+'</span>').join('') + '</div>'; });
      }
      if (notes.length){
        b += '<h2>Notlar</h2>';
        notes.forEach(n => { b += '<h3>' + esc(n.title) + '</h3>' + (n.body?'<div>'+esc(n.body).replace(/\n/g,'<br>')+'</div>':'') + (n.tags.length?'<div>'+n.tags.map(x=>'<span class="tag">#'+esc(x)+'</span>').join('')+'</div>':''); });
      }
      if (!mine.length) b += '<p><em>Boş.</em></p>';
    });
    b += '</body></html>';
    const w = window.open('', '_blank');
    if (!w) { alert('PDF için açılır pencereye izin verin.'); return; }
    w.document.write(b);
    w.document.close();
    w.focus();
    setTimeout(() => w.print(), 350);
  }

  function exportJSON() {
    const data = { version: 1, exported: Date.now(), projects: projects, items: items };
    download(JSON.stringify(data, null, 2), 'notlar-yedek-' + new Date().toISOString().slice(0,10) + '.json', 'application/json');
  }

  async function importJSON(file) {
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data.projects || !data.items) throw new Error('format');
      if (!confirm('Yedek yüklensin mi? Mevcut projeler ve öğeler bununla DEĞİŞTİRİLECEK.')) return;
      // clear existing storage
      if (storageOK) {
        for (const p of projects) await sDel('proj:' + p.id);
        for (const i of items) await sDel('item:' + i.id);
      }
      projects = data.projects;
      items = data.items;
      if (storageOK) {
        for (const p of projects) await sSet('proj:' + p.id, JSON.stringify(p));
        for (const i of items) await sSet('item:' + i.id, JSON.stringify(i));
      }
      activeProject = projects.length ? projects[0].id : null;
      if (!activeProject) await createProject('Genel');
      renderProjects(); renderMain();
      el('status').textContent = 'Yedek yüklendi.';
    } catch(e) {
      alert('Geçersiz yedek dosyası.');
    }
  }

  function handleExportAction(act) {
    closeExportMenu();
    switch(act) {
      case 'proj-md': exportMarkdown('one'); break;
      case 'proj-txt': exportText('one'); break;
      case 'proj-pdf': exportPDF('one'); break;
      case 'all-md': exportMarkdown('all'); break;
      case 'all-txt': exportText('all'); break;
      case 'all-pdf': exportPDF('all'); break;
      case 'json-export': exportJSON(); break;
      case 'json-import': el('importFile').click(); break;
    }
  }

  function fmtDate(ts) {
    return new Date(ts).toLocaleString('tr-TR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }
  function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

  // ---- Drawer (mobile) ----
  function openDrawer(){ el('app').classList.add('drawer-open'); }
  function closeDrawer(){ el('app').classList.remove('drawer-open'); }
  el('menuBtn').addEventListener('click', openDrawer);
  el('overlay').addEventListener('click', closeDrawer);

  el('addProj').addEventListener('click', () => {
    const n = el('newProj').value.trim();
    if (n) { createProject(n); el('newProj').value = ''; closeDrawer(); }
  });
  el('newProj').addEventListener('keydown', e => { if (e.key==='Enter') el('addProj').click(); });

  el('tNote').addEventListener('click', () => setType('note'));
  el('tTask').addEventListener('click', () => setType('task'));
  function setType(t) {
    composerType = t;
    el('tNote').classList.toggle('sel', t==='note');
    el('tTask').classList.toggle('sel', t==='task');
    el('cBody').placeholder = t==='task' ? 'Görev açıklaması (opsiyonel)...' : 'İçerik...';
    el('cTitle').placeholder = t==='task' ? 'Görev' : 'Başlık';
  }

  el('add').addEventListener('click', addItem);
  el('cBody').addEventListener('keydown', e => { if ((e.metaKey||e.ctrlKey) && e.key==='Enter') addItem(); });
  el('search').addEventListener('input', renderMain);

  // ---- Export menu ----
  function openExportMenu(){ el('exportMenu').classList.add('open'); }
  function closeExportMenu(){ el('exportMenu').classList.remove('open'); }
  el('export').addEventListener('click', (e) => {
    e.stopPropagation();
    el('exportMenu').classList.toggle('open');
  });
  el('exportMenu').addEventListener('click', (e) => {
    const act = e.target.dataset.act;
    if (act) handleExportAction(act);
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.export-wrap')) closeExportMenu();
  });
  el('importFile').addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (f) importJSON(f);
    e.target.value = '';
  });

  loadAll();
</script>
</body>
</html>
